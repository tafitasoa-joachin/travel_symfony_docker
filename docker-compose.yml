services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 03302joachin
      MYSQL_DATABASE: travel
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      interval: 10s
      retries: 10

  php:
    build: .
    depends_on:
      - database
    volumes:
      - .:/var/www/project
    environment:
      - DATABASE_URL=mysql://root:03302joachin@database:3306/travel
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_WASTED_PERCENTAGE=10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      - "${PORT:-80}:80" # Utilisez la variable PORT fournie par Render
    volumes:
      - .:/var/www/project
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  mysql_data:
