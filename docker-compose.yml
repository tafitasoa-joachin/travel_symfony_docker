# Suppression de la directive 'version' obsolète

services:
  database:
    # Renommé de 'db' à 'database' pour correspondre à l'erreur
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 03302joachin
      MYSQL_DATABASE: travel
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      interval: 10s
      retries: 10

  php:
    build: . # Assurez-vous que vous avez un Dockerfile à la racine du projet
    depends_on:
      - database # Mise à jour de la dépendance
    volumes:
      - .:/var/www/project
    environment:
      - DATABASE_URL=mysql://root:03302joachin@database:3306/travel # Mise à jour du nom du service
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_WASTED_PERCENTAGE=10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      # - "8082:80"
      - "80:80"
    volumes:
      - .:/var/www/project
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  # Optionnel: Pour les tâches asynchrones
  worker:
    build: .
    depends_on:
      - database # Mise à jour de la dépendance
    command: php bin/console messenger:consume async -vv
    restart: unless-stopped
    volumes:
      - .:/var/www/project
    environment:
      - DATABASE_URL=mysql://root:03302joachin@database:3306/travel # Mise à jour du nom du service
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_WASTED_PERCENTAGE=10

volumes:
  mysql_data:
