services:
  - type: web
    name: symfony-app
    runtime: docker
    env: docker
    dockerCommand: docker-compose up 
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php -S 0.0.0.0:$PORT -t public"  # Utilisez $PORT au lieu de 10000
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        value: your_app_secret
      - key: DATABASE_URL
        value: mysql://root:03302joachin@symfony-db:3306/travel  # Utilisez le nom correct du service

  - type: database
    name: symfony-db
    engine: mysql
    version: 8.0
    plan: free
    databaseName: travel
    user: root
    password: 03302joachin