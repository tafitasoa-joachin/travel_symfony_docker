services:
  - type: web
    name: symfony-app
    runtime: docker
    env: docker
    buildCommand: ""  # La construction se fait dans le Dockerfile
    startCommand: ""  # La commande de démarrage est définie dans le Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: 0
      - key: APP_SECRET
        value: votre_secret_app  # Utilisez une valeur sécurisée
      - key: DATABASE_URL
        value: mysql://root:03302joachin@internal-symfony-db:3306/travel?serverVersion=8.0&charset=utf8mb4
      # L'URL interne de Render pour MySQL commence par "internal-"
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,REMOTE_ADDR"
      - key: TRUSTED_HOSTS
        value: "^.*$"  # À restreindre sur les environnements de production réels

  - type: database
    name: symfony-db
    engine: mysql
    version: 8.0
    plan: free
    databaseName: travel
    user: root
    password: 03302joachin